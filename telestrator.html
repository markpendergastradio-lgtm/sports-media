<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Touchline Telestrator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: edit-suite grid. Tool rail | broadcast stage | inspector, with transport and timeline docked underneath. */
:root{
  --bg:#12161c; --panel:#1a1f27; --raised:#232a34; --line:#2d3540; --ink:#e6e9ee; --muted:#8c96a5;
  --screen:#07090c; --accent:#ffd23f; --accent-ink:#1d1700; --freeze:#ff6b57; --on-freeze:#ffffff; --track:#5ad1ff;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body)}
.app{max-width:1600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 20px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand h1{margin:0;font:700 22px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.brand h1 span{color:var(--muted);font-weight:500}
.clip{margin:3px 0 0;font:12px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42ch}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{font:500 13px var(--f-body);background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{padding:5px 9px;font-size:12px}
body.exporting .tools,body.exporting .actions>*:not(#coachBtn),body.exporting .transport,body.exporting .inspector{pointer-events:none;opacity:.45}
.rec-dot{width:9px;height:9px;border-radius:50%;background:var(--freeze);flex:none}
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:color-mix(in srgb,var(--screen) 72%,transparent);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));overflow:auto}
.card{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.card h3{margin:0;font:700 22px/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.card fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.card legend{font-size:12px;color:var(--muted);margin-bottom:6px;padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent)}
.opt input{accent-color:var(--accent);margin:2px 0 0}
.opt b{display:block;font-weight:600}
.opt small{color:var(--muted);font:12px var(--f-mono)}
.card .checks{margin:0}
.card video{width:100%;max-width:100%;border-radius:8px;background:var(--screen);display:block}
.facts{font:12px var(--f-mono);color:var(--muted);margin:0}
.msg{margin:0;font-size:13px;min-height:1.4em}
.msg.err{color:var(--freeze)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--freeze);background:transparent;border-color:color-mix(in srgb,var(--freeze) 45%,transparent);width:100%;justify-content:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 2px;cursor:pointer}
.toggle input,.checks input{accent-color:var(--accent);width:16px;height:16px;margin:0}
input[type=range]{accent-color:var(--accent);width:100%}
.keytol{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.keytol input{width:84px}
.sep{width:1px;height:22px;background:var(--line)}
.work{display:grid;grid-template-columns:52px minmax(0,1fr) 300px;gap:12px;align-items:start}
.tools{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px}
.tool{position:relative;width:38px;height:38px;display:grid;place-items:center;border-radius:7px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.tool:hover{background:var(--raised)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tool svg{width:20px;height:20px}
.tool kbd{position:absolute;right:3px;bottom:1px;font:600 9px var(--f-mono);opacity:.6}
.tools[data-off="true"] .tool{opacity:.3;pointer-events:none}
.stage-col{min-width:0}
.stage{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;background:var(--screen);border:1px solid var(--line);border-radius:10px;overflow:hidden}
#stage{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.badge{position:absolute;top:12px;left:12px;font:700 15px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;padding:7px 10px;border-radius:4px;font-variant-numeric:tabular-nums}
.badge.freeze{background:var(--freeze);color:var(--on-freeze)}
.badge.coach{left:auto;right:12px;background:var(--accent);color:var(--accent-ink)}
.trackui{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--bg) 90%,transparent);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;max-width:calc(100% - 24px);white-space:nowrap}
.meter{width:120px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--track)}
.drop{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 82%,transparent);border:2px dashed var(--accent);border-radius:10px;font:600 22px var(--f-display);letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
.hint{margin:8px 2px 0;color:var(--muted);font-size:13px;min-height:1.45em}
.hint.err{color:var(--freeze)}
.inspector{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:18px;min-width:0}
.inspector h2{margin:0 0 10px;font:600 13px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
#gList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:230px;overflow:auto}
.g-row{width:100%;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:4px 9px;align-items:center;padding:7px 8px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--ink);font:13px var(--f-body);text-align:left;cursor:pointer}
.g-row:hover{background:var(--raised)}
.g-row.sel{background:var(--raised);border-color:var(--line)}
.dot{width:10px;height:10px;border-radius:50%}
.g-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.g-time{font:11px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.g-chips{grid-column:2 / 4;display:flex;gap:4px}
.g-chips:empty{display:none}
.chip{font:600 10px/1 var(--f-mono);padding:3px 5px;border-radius:3px;letter-spacing:.04em;text-transform:uppercase}
.chip.fz{background:color-mix(in srgb,var(--freeze) 22%,transparent);color:var(--freeze)}
.chip.tk{background:color-mix(in srgb,var(--track) 20%,transparent);color:var(--track)}
.empty{color:var(--muted);font-size:13px;padding:6px 2px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.lab{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
output{font:12px var(--f-mono);color:var(--ink)}
input[type=text],input[type=number],select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:13px var(--f-body);width:100%;min-width:0}
input[type=number]{font-family:var(--f-mono)}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.checks{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.checks:empty{display:none}
.checks label{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.timing{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 8px;align-items:center}
.timing label{font-size:12px;color:var(--muted)}
.note{margin:0 0 6px;font-size:12px;color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.keys{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;margin:0;font-size:12.5px;align-items:center}
.keys dt{font:500 11px var(--f-mono);background:var(--raised);border:1px solid var(--line);border-radius:4px;padding:2px 6px;justify-self:start}
.keys dd{margin:0;color:var(--muted)}
.intro{margin:0 0 12px;font-size:12.5px;color:var(--muted)}
.transport{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ctl{width:36px;height:34px;display:grid;place-items:center;border-radius:6px;border:1px solid var(--line);background:var(--raised);color:var(--ink);cursor:pointer;padding:0}
.ctl svg{width:16px;height:16px}
.ctl.play{width:48px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tc{font:500 20px/1 var(--f-mono);font-variant-numeric:tabular-nums;margin-left:6px}
.tc small{font-size:13px;color:var(--muted)}
.speed{width:auto;margin-left:auto}
.tl{position:relative;user-select:none;touch-action:none;cursor:ew-resize;padding-bottom:2px}
.ruler{position:relative;height:24px;border-bottom:1px solid var(--line)}
.tick{position:absolute;bottom:0;width:1px;height:5px;background:var(--line)}
.tick.maj{height:10px;background:var(--muted)}
.tick span{position:absolute;bottom:11px;left:3px;font:10px var(--f-mono);color:var(--muted);white-space:nowrap}
.lanes{display:flex;flex-direction:column;gap:3px;padding-top:6px}
.lane{position:relative;height:20px}
.lane.empty{height:auto;color:var(--muted);font-size:12px;padding:2px 0}
.tl-bar{position:absolute;top:0;height:20px;border-radius:4px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 24%,transparent);color:var(--ink);font:11px var(--f-body);padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;cursor:pointer;min-width:6px}
.tl-bar.sel{background:color-mix(in srgb,var(--c) 50%,transparent);outline:2px solid var(--ink);outline-offset:1px}
.tl-bar span{overflow:hidden;text-overflow:ellipsis}
.fzm{width:8px;height:8px;background:var(--freeze);transform:rotate(45deg);margin-right:6px;flex:none}
.playhead{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--freeze);pointer-events:none}
.playhead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--freeze)}
@media (max-width:980px){
  .work{grid-template-columns:minmax(0,1fr)}
  .tools{flex-direction:row;flex-wrap:wrap}
  .tool{width:42px;height:40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="7" fill="var(--raised)"/><ellipse cx="17" cy="24" rx="10" ry="3.6" fill="none" stroke="var(--accent)" stroke-width="2.4"/><path d="M8 13 Q16 4 25 10" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3 3"/><path d="M21 8 L25.5 10.2 L22.5 14" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div>
        <h1>Touchline <span>Telestrator</span></h1>
        <p class="clip" id="clipName">Sample match</p><p class="clip"><a href="./" style="color:var(--accent)">← Sports Media course site</a></p>
      </div>
    </div>
    <div class="actions">
      <label class="btn" for="file">Upload video</label>
      <input type="file" id="file" accept="video/*" hidden>
      <button class="btn ghost" id="demoBtn" type="button">Sample match</button>
      <button class="btn primary" id="exportBtn" type="button">Export video</button>
      <span class="sep" aria-hidden="true"></span>
      <label class="toggle"><input type="checkbox" id="autoTrack" checked> Auto-track</label>
      <label class="toggle"><input type="checkbox" id="keyOn" checked> Draw under players</label>
      <label class="keytol" for="keyTol">Grass key <input type="range" id="keyTol" min="6" max="80" value="24"></label>
      <span class="sep" aria-hidden="true"></span>
      <button class="btn" id="coachBtn" type="button" aria-pressed="false">Coach mode</button>
      <button class="btn ghost" id="undoBtn" type="button" disabled>Undo</button>
    </div>
  </header>

  <div class="work">
    <nav class="tools" id="tools" aria-label="Drawing tools"></nav>
    <section class="stage-col">
      <div class="stage" id="stageWrap">
        <canvas id="stage" aria-label="Video with telestration graphics"></canvas>
        <div class="badge freeze" id="freezeBadge" hidden>Freeze <span id="freezeLeft"></span></div>
        <div class="badge coach" id="coachBadge" hidden>Coach mode</div>
        <div class="trackui" id="trackUI" hidden>
          <span>Tracking <b id="trackName"></b></span>
          <span class="meter"><i id="trackBar"></i></span>
          <button class="btn sm" id="trackStop" type="button">Stop</button>
        </div>
        <div class="trackui" id="recUI" hidden>
          <i class="rec-dot" aria-hidden="true"></i>
          <span>Recording <b id="recPct">0%</b></span>
          <span class="meter"><i id="recBar"></i></span>
          <button class="btn sm" id="recStop" type="button">Cancel</button>
        </div>
        <div class="drop" id="drop" hidden>Drop video to load</div>
      </div>
      <p class="hint" id="hint"></p>
    </section>
    <aside class="inspector">
      <section>
        <h2>Graphics <span id="gCount">0</span></h2>
        <ul id="gList"></ul>
      </section>
      <section id="props"></section>
    </aside>
  </div>

  <footer class="transport">
    <div class="controls">
      <button class="ctl" id="toStart" type="button" aria-label="Go to start"><svg viewBox="0 0 16 16"><path d="M3 2v12M13 2 5 8l8 6z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
      <button class="ctl" id="stepBack" type="button" aria-label="Back one frame"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="ctl play" id="playBtn" type="button" aria-label="Play"></button>
      <button class="ctl" id="stepFwd" type="button" aria-label="Forward one frame"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span class="tc"><span id="tcNow">00:00:00</span> <small>/ <span id="durTc">00:20:00</span></small></span>
      <select class="speed" id="speedSel" aria-label="Playback speed">
        <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option>
      </select>
    </div>
    <div class="tl" id="tl">
      <div class="ruler" id="ruler"></div>
      <div class="lanes" id="lanes"></div>
      <div class="playhead" id="playhead"></div>
    </div>
  </footer>
</div>

<div class="modal" id="exModal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="exTitle">
    <h3 id="exTitle">Export video</h3>
    <div id="exSetup" style="display:flex;flex-direction:column;gap:14px">
      <fieldset>
        <legend>What to export</legend>
        <label class="opt"><input type="radio" name="exRange" value="all" checked><span><b>Whole clip</b><small id="exAllTxt"></small></span></label>
        <label class="opt"><input type="radio" name="exRange" value="graphics" id="exRangeG"><span><b>Graphics section only</b><small id="exGTxt"></small></span></label>
      </fieldset>
      <div class="checks"><label><input type="checkbox" id="exAudio" checked> Include the clip&rsquo;s sound</label></div>
      <p class="note" id="exNote"></p>
      <div class="row"><button class="btn primary" id="exGo" type="button">Start export</button><button class="btn ghost" id="exCancel" type="button">Cancel</button></div>
    </div>
    <div id="exDone" hidden style="display:flex;flex-direction:column;gap:12px">
      <video id="exPreview" controls playsinline></video>
      <p class="facts" id="exFacts"></p>
      <p class="msg" id="exMsg"></p>
      <div class="row"><button class="btn primary" id="exSave" type="button">Save video</button><button class="btn" id="exAgain" type="button">Export again</button><button class="btn ghost" id="exClose" type="button">Close</button></div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 1280, H = 720, FPS = 25;
const $ = id => document.getElementById(id);
const stage = $('stage'); stage.width = W; stage.height = H;
const ctx = stage.getContext('2d');
const mk2d = (w, h, rf) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d', rf ? { willReadFrequently: true } : undefined)]; };
const [frameC, fctx] = mk2d(W, H, true);
const [smallC, sctx] = mk2d(W / 2, H / 2, true);
const [keyC, kctx] = mk2d(W, H);
const video = document.createElement('video');
video.muted = true; video.playsInline = true; video.preload = 'auto';

const NAMES = { arrow: 'Arrow', run: 'Run', spotlight: 'Spotlight', link: 'Player link', zone: 'Zone', pen: 'Freehand', text: 'Caption' };
const GROUND = ['arrow', 'run', 'spotlight', 'link', 'zone'];
const TRACKABLE = ['spotlight', 'link', 'zone'];
const SWATCHES = ['#ffd23f', '#ffffff', '#5ad1ff', '#ff6b57', '#7cf29a', '#c48bff'];
const HINTS = {
  select: 'Click a graphic to edit it. Drag its handles to reshape it, or drag the graphic to move it.',
  arrow: 'Drag to draw a pass or movement arrow. Drag the round middle handle afterwards to bend it.',
  run: 'Drag to draw a dashed off-ball run. Bend it with the round middle handle.',
  spotlight: 'Click at a player’s feet to spotlight them. With auto-track on, the ring follows the player to the out point.',
  link: 'Click players in turn to link them, such as a back four. Double-click or press Enter to finish.',
  zone: 'Click to place the corners of a zone. Click the first corner, double-click or press Enter to close it.',
  pen: 'Drag to draw freehand.',
  text: 'Click where the caption should sit, then type it in the inspector.',
  coach: 'Coach mode: draw anywhere, even while the clip plays. Marks fade after a few seconds and are not saved.'
};
const ICONS = {
  select: '<path d="M5 3l13 6.5-5.6 1.9L10.5 17z" fill="currentColor"/>',
  arrow: '<path d="M4 20 18 6M11 6h7v7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  run: '<path d="M4 20 18 6" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2.5 3" stroke-linecap="round"/><path d="M11 6h7v7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  spotlight: '<ellipse cx="12" cy="18.5" rx="8.5" ry="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="6" r="2.4" fill="currentColor"/><path d="M12 9v7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',

  ${g.type === 'spotlight' || g.type === 'text' ? `<div class="field"><label for="pLabel">${g.type === 'text' ? 'Caption' : 'Name tag'}</label><input id="pLabel" type="text" maxlength="40" value="${esc(g.label)}" placeholder="${g.type === 'text' ? 'Caption text' : 'Shirt number or name'}"></div>` : ''}
  ${g.type !== 'text' ? `<div class="field"><label for="pWidth">Line weight <output id="oWidth">${g.width}</output></label><input id="pWidth" type="range" min="2" max="12" step="1" value="${g.width}"></div>` : ''}
  ${g.type === 'spotlight' ? `<div class="field"><label for="pSize">Ring size <output id="oSize">${g.size}</output></label><input id="pSize" type="range" min="12" max="90" value="${g.size}"></div>` : ''}
  <div class="checks">${['arrow', 'run', 'link'].includes(g.type) ? `<label><input id="pDashed" type="checkbox"${g.dashed ? ' checked' : ''}> Dashed line</label>` : ''}${GROUND.includes(g.type) ? `<label><input id="pUnder" type="checkbox"${g.under ? ' checked' : ''}> Draw under players</label>` : ''}</div>
  <div class="field"><span class="lab">Timing</span><div class="timing">
    <label for="pIn">In</label><input id="pIn" type="number" step="0.04" min="0" max="${r2(S.dur)}" value="${g.tIn}"><button type="button" class="btn sm" data-set="in">Use playhead</button>
    <label for="pOut">Out</label><input id="pOut" type="number" step="0.04" min="0" max="${r2(S.dur)}" value="${g.tOut}"><button type="button" class="btn sm" data-set="out">Use playhead</button>
  </div></div>
  <div class="field"><label for="pFreeze">Freeze clip at In <output id="oFreeze">${g.freeze ? g.freeze + ' s' : 'Off'}</output></label><input id="pFreeze" type="range" min="0" max="6" step="0.5" value="${g.freeze}"></div>
  ${tr ? `<div class="field"><span class="lab">Tracking</span><p class="note">${tracked ? 'Follows the player from In to Out. Dragging a handle unpins it; track again to re-follow.' : 'Fixed in place. Track to follow the player from In to Out.'}</p><div class="row"><button type="button" class="btn sm" id="pTrack">${tracked ? 'Track again' : 'Track player'}</button>${tracked ? '<button type="button" class="btn sm ghost" id="pUntrack">Clear tracking</button>' : ''}</div></div>` : ''}
  <button type="button" class="btn danger" id="pDelete">Delete graphic</button>`;
  const on = (id, ev, fn) => { const x = $(id); if (x) x.addEventListener(ev, fn); };
  el.querySelectorAll('.sw').forEach(b => b.addEventListener('click', () => { g.color = b.dataset.c; refreshUI(); }));
  on('pLabel', 'input', e => { g.label = e.target.value; renderList(); renderLanes(); });
  on('pWidth', 'input', e => { g.width = +e.target.value; $('oWidth').textContent = g.width; });
  on('pSize', 'input', e => { g.size = +e.target.value; $('oSize').textContent = g.size; });
  on('pDashed', 'change', e => { g.dashed = e.target.checked; });
  on('pUnder', 'change', e => { g.under = e.target.checked; });
  on('pIn', 'change', e => { g.tIn = r2(clamp(+e.target.value || 0, 0, g.tOut - 0.04)); refreshUI(); });
  on('pOut', 'change', e => { g.tOut = r2(clamp(+e.target.value || 0, g.tIn + 0.04, S.dur)); refreshUI(); });
  el.querySelectorAll('[data-set]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.set === 'in') g.tIn = r2(Math.min(S.t, g.tOut - 0.04)); else g.tOut = r2(Math.max(S.t, g.tIn + 0.04)); refreshUI();
  }));
  on('pFreeze', 'input', e => { g.freeze = +e.target.value; $('oFreeze').textContent = g.freeze ? g.freeze + ' s' : 'Off'; renderList(); renderLanes(); });
  on('pTrack', 'click', () => { hist(); trackGraphic(g); });
  on('pUntrack', 'click', () => { hist(); g.anchors.forEach(a => { if (a.track) { const p = aAt(a, S.t); a.x = p.x; a.y = p.y; a.track = null; } }); refreshUI(); });
  on('pDelete', 'click', () => removeG(g, true));
}
$('props').addEventListener('pointerdown', () => hist(), true);
$('props').addEventListener('focusin', () => hist(), true);
$('gList').addEventListener('click', e => {
  const b = e.target.closest('.g-row'); if (!b) return;
  const g = S.graphics.find(x => x.id === +b.dataset.id); if (!g) return;
  if (!visible(g, S.t)) { pause(); setTime(g.tIn); }
  setTool('select'); select(g);
});

/* ---------- Timeline ---------- */
function renderRuler() {
  const steps = [1, 2, 5, 10, 15, 30, 60, 120, 300]; const st = steps.find(s => S.dur / s <= 12) || 600;
  const minor = st >= 5 ? st / 5 : st; let h = '';
  for (let s = 0; s <= S.dur + 1e-6; s += minor) {
    const maj = Math.abs(s / st - Math.round(s / st)) < 1e-6;
    h += `<i class="tick${maj ? ' maj' : ''}" style="left:${s / S.dur * 100}%">${maj ? `<span>${Math.floor(s / 60)}:${pad(Math.round(s) % 60)}</span>` : ''}</i>`;
  }
  $('ruler').innerHTML = h;
}
function renderLanes() {
  $('lanes').innerHTML = S.graphics.map(g => {
    const l = g.tIn / S.dur * 100, w = Math.max(0.6, (g.tOut - g.tIn) / S.dur * 100);
    return `<div class="lane"><button type="button" class="tl-bar${S.sel === g ? ' sel' : ''}" data-id="${g.id}" style="left:${l}%;width:${w}%;--c:${g.color}">${g.freeze ? '<i class="fzm"></i>' : ''}<span>${esc(label(g))}</span></button></div>`;
  }).join('') || '<div class="lane empty">Each graphic gets a bar here showing when it is on screen.</div>';
}
(() => {
  const tl = $('tl'); let scrub = false;
  const at = e => { const r = $('ruler').getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width, 0, 1) * S.dur; };
  tl.addEventListener('pointerdown', e => {
    if (S.tracking || S.exporting) return;
    const b = e.target.closest('.tl-bar');
    if (b) { const g = S.graphics.find(x => x.id === +b.dataset.id); if (g) { if (!visible(g, S.t)) { pause(); setTime(g.tIn); } setTool('select'); select(g); } return; }
    scrub = true; tl.setPointerCapture(e.pointerId); pause(); setTime(at(e));
  });
  tl.addEventListener('pointermove', e => { if (scrub) setTime(at(e)); });
  const end = () => { scrub = false; };
  tl.addEventListener('pointerup', end); tl.addEventListener('pointercancel', end);
})();

function refreshUI() { renderList(); renderProps(); renderLanes(); updateUndo(); }
function refreshAll() { renderRuler(); refreshUI(); $('clipName').textContent = S.clipName; $('durTc').textContent = tc(S.dur); }

/* ---------- Export: record the stage in real time ---------- */
const EX = { rec: null, chunks: [], blob: null, url: '', type: '', ext: '', name: '', start: 0, end: 0, cancel: false, stopping: false };
let AC = null, audioDest = null, dl = null;
(async () => { try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; } })();
function pickType(withAudio) {
  if (typeof MediaRecorder === 'undefined') return null;
  const list = withAudio
    ? ['video/mp4;codecs=avc1.42E01F,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']
    : ['video/mp4;codecs=avc1.42E01F', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  const t = list.find(x => { try { return MediaRecorder.isTypeSupported(x); } catch (e) { return false; } });
  return t ? { type: t, ext: t.startsWith('video/mp4') ? 'mp4' : 'webm' } : null;
}
function audioTrack() {
  try {
    if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); const src = AC.createMediaElementSource(video); audioDest = AC.createMediaStreamDestination(); src.connect(audioDest); video.muted = false; }
    AC.resume(); return audioDest.stream.getAudioTracks()[0] || null;
  } catch (e) { return null; }
}
function graphicsRange() {
  if (!S.graphics.length) return null;
  return [r2(Math.max(0, Math.min(...S.graphics.map(g => g.tIn)) - 1)), r2(Math.min(S.dur, Math.max(...S.graphics.map(g => g.tOut)) + 1))];
}
function openExport() {
  if (S.tracking || S.exporting) return;
  pause(); S.draft = null;
  const fmt = pickType(false);
  if (!fmt) { flash('This browser can’t record video. Use a current version of Chrome, Edge or Safari to export.'); return; }
  const gr = graphicsRange(), freezes = S.graphics.reduce((s, g) => s + (g.freeze || 0), 0);
  $('exAllTxt').textContent = `${tc(0)} – ${tc(S.dur)}`;
  $('exRangeG').disabled = !gr; $('exGTxt').textContent = gr ? `${tc(gr[0])} – ${tc(gr[1])}` : 'Add a graphic first';
  if (!gr) document.querySelector('input[name=exRange][value=all]').checked = true;
  const au = $('exAudio'); au.disabled = S.src !== 'video'; if (S.src !== 'video') au.checked = false;
  $('exNote').textContent = `Plays the clip through once in real time with every graphic and freeze frame burned in${freezes ? ` (freezes add ${freezes} s)` : ''}. Keep this tab in front while it records. Output: 1280×720 ${fmt.ext.toUpperCase()}. Coach-mode marks drawn during recording are included.`;
  $('exSetup').hidden = false; $('exDone').hidden = true; $('exModal').hidden = false; $('exGo').focus();
}
function closeExport() { $('exModal').hidden = true; }
async function startExport() {
  const range = document.querySelector('input[name=exRange]:checked').value === 'graphics' && graphicsRange() ? graphicsRange() : [0, S.dur];
  const wantAudio = $('exAudio').checked && S.src === 'video';
  const at = wantAudio ? audioTrack() : null;
  const fmt = pickType(!!at) || pickType(false);
  closeExport();
  if (!fmt || !stage.captureStream) { flash('This browser can’t record the canvas. Use a current version of Chrome, Edge or Safari.'); return; }
  pause(); setTime(range[0]); if (S.src === 'video') await seekVideo(range[0]);
  const stream = stage.captureStream(30); if (at) stream.addTrack(at);
  let rec;
  try { rec = new MediaRecorder(stream, { mimeType: fmt.type, videoBitsPerSecond: 8000000 }); }
  catch (e) { flash('Recording couldn’t start in this browser. Try Chrome or Edge.'); return; }
  Object.assign(EX, { rec, chunks: [], type: fmt.type, ext: fmt.ext, start: range[0], end: range[1], cancel: false, stopping: false });
  rec.ondataavailable = e => { if (e.data && e.data.size) EX.chunks.push(e.data); };
  rec.onstop = finishExport;
  S.exporting = true; document.body.classList.add('exporting'); $('recUI').hidden = false; select(null);
  rec.start(500); play();
}
function exportTick() {
  const span = Math.max(0.01, EX.end - EX.start), f = clamp((S.t - EX.start) / span, 0, 1);
  $('recPct').textContent = Math.round(f * 100) + '%'; $('recBar').style.width = (f * 100) + '%';
  if (S.playing && !S.freezeUntil && S.t >= EX.end - 1e-3) pause();
  if (!S.playing && !EX.stopping) { EX.stopping = true; setTimeout(() => { try { EX.rec.stop(); } catch (e) { finishExport(); } }, 200); }
}
function finishExport() {
  S.exporting = false; document.body.classList.remove('exporting'); $('recUI').hidden = true;
  EX.rec.stream && EX.rec.stream.getVideoTracks().forEach(t => t.stop());
  if (EX.cancel || !EX.chunks.length) { if (!EX.cancel) flash('Nothing was recorded. Keep this tab in front and try again.'); return; }
  EX.blob = new Blob(EX.chunks, { type: EX.type.split(';')[0] });
  if (EX.url) URL.revokeObjectURL(EX.url);
  EX.url = URL.createObjectURL(EX.blob);
  const base = (S.src === 'demo' ? 'sample-match' : S.clipName.replace(/\.[^.]+$/, '')).replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-') || 'clip';
  EX.name = `${base}-telestrated.${EX.ext}`;
  const mb = EX.blob.size / 1048576;
  $('exPreview').src = EX.url;
  $('exFacts').textContent = `${EX.name} · ${mb < 10 ? mb.toFixed(1) : Math.round(mb)} MB · 1280×720`;
  const m = $('exMsg'); m.className = 'msg'; m.textContent = 'Check the preview, then save it.';
  $('exSave').disabled = false;
  $('exSetup').hidden = true; $('exDone').hidden = false; $('exModal').hidden = false;
}
async function saveExport() {
  const m = $('exMsg');
  if (!EX.blob) return;
  if (!dl) { const a = document.createElement('a'); a.href = EX.url; a.download = EX.name; document.body.appendChild(a); a.click(); a.remove(); m.className = 'msg'; m.textContent = `Downloading ${EX.name}. Check your Downloads folder.`; return; }
  $('exSave').disabled = true;
  try {
    const r = await dl.save({ filename: EX.name, data: EX.blob });
    m.className = 'msg'; m.textContent = r && r.status === 'delivered' ? 'Sent to the destination you chose.' : `Saved ${EX.name}.`;
  } catch (e) {
    const c = e && e.code; m.className = 'msg err';
    m.textContent = c === 'declined' ? 'Save cancelled. Press Save video to try again.'
      : c === 'rate_limited' ? 'A save prompt is already open. Finish that one, then try again.'
      : c === 'too_large' ? 'That file is too large to save here. Export the graphics section only for a smaller file.'
      : (c === 'rejected_extension' || c === 'extension_not_enabled') ? `This view can’t save ${EX.ext.toUpperCase()} files.`
      : 'Saving isn’t available in this view. Right-click the preview and choose Save video as.';
  }
  $('exSave').disabled = false;
}

/* ---------- Sources ---------- */
async function loadDemo() {
  pause(); video.removeAttribute('src'); video.load();
  S.src = 'demo'; S.dur = 20; S.graphics = []; S.sel = null; S.draft = null; S.clipName = 'Sample match · 20 s'; setTime(5);
  const t = 5, at = id => { const q = playerAt(PL[id], t), p = proj(q.X, q.Y); return { x: p.x, y: p.y }; };
  const a9 = at('A9'), tgt = proj(97, 38);
  const spot = mkG('spotlight', [a9], { tIn: 5, tOut: 11, freeze: 2, label: '9', size: 30 });
  const run = mkG('run', [a9, { x: (a9.x + tgt.x) / 2 + 10, y: (a9.y + tgt.y) / 2 - 46 }, tgt], { tIn: 5, tOut: 9.5, color: '#ffffff' });
  const line = mkG('link', ['B3', 'B4', 'B5', 'B2'].map(at), { tIn: 5, tOut: 9.5, color: '#5ad1ff' });
  const cap = mkG('text', [{ x: 36, y: 112 }], { tIn: 5, tOut: 9.5, label: 'Run in behind the back four' });
  S.graphics = [line, run, spot, cap];
  refreshAll();
  await trackGraphic(line, true); await trackGraphic(spot, true);
  setTime(5.6); S.history = []; refreshAll();
}
async function loadFile(f) {
  if (!f) return;
  if (!/^video\//.test(f.type)) { flash('That file isn’t a video. Load an MP4, WebM or MOV clip.'); return; }
  pause(); video.src = URL.createObjectURL(f);
  const ok = await new Promise(res => { video.onloadeddata = () => res(true); video.onerror = () => res(false); });
  if (!ok || !isFinite(video.duration)) { flash('This browser can’t play that clip. Try an MP4 (H.264) or WebM file.'); loadDemo(); return; }
  S.src = 'video'; S.dur = video.duration; S.graphics = []; S.sel = null; S.history = []; S.draft = null; S.clipName = f.name;
  setTime(0); await seekVideo(0); refreshAll();
}
video.addEventListener('ended', () => { if (S.src === 'video') pause(); });

/* ---------- Wiring ---------- */
$('tools').innerHTML = TOOLS.map(([id, name, key]) => `<button type="button" class="tool" data-tool="${id}" aria-pressed="false" aria-label="${name} (${key})" title="${name} (${key})"><svg viewBox="0 0 24 24">${ICONS[id]}</svg><kbd>${key}</kbd></button>`).join('');
$('tools').addEventListener('click', e => { const b = e.target.closest('.tool'); if (b) setTool(b.dataset.tool); });
$('file').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
$('demoBtn').addEventListener('click', () => { if (!S.tracking && !S.exporting) loadDemo(); });
$('exportBtn').addEventListener('click', openExport);
$('exGo').addEventListener('click', startExport);
$('exCancel').addEventListener('click', closeExport);
$('exClose').addEventListener('click', closeExport);
$('exAgain').addEventListener('click', openExport);
$('exSave').addEventListener('click', saveExport);
$('recStop').addEventListener('click', () => { if (S.exporting) { EX.cancel = true; pause(); flash('Export cancelled.'); } });
$('exModal').addEventListener('click', e => { if (e.target === $('exModal') && !$('exSetup').hidden) closeExport(); });
$('autoTrack').addEventListener('change', e => { S.autoTrack = e.target.checked; });
$('keyOn').addEventListener('change', e => { S.keyOn = e.target.checked; });
$('keyTol').addEventListener('input', e => { S.keyTol = +e.target.value; });
function toggleCoach() { S.coach = !S.coach; S.draft = null; $('coachBtn').setAttribute('aria-pressed', String(S.coach)); $('coachBadge').hidden = !S.coach; $('tools').dataset.off = String(S.coach); stage.style.cursor = S.coach ? 'crosshair' : (S.tool === 'select' ? 'default' : 'crosshair'); setHint(); }
$('coachBtn').addEventListener('click', toggleCoach);
$('undoBtn').addEventListener('click', undo);
$('trackStop').addEventListener('click', () => { if (S.tracking) S.tracking.cancel = true; });
$('playBtn').addEventListener('click', togglePlay);
$('toStart').addEventListener('click', () => { pause(); setTime(0); });
$('stepBack').addEventListener('click', () => stepFrames(-1));
$('stepFwd').addEventListener('click', () => stepFrames(1));
$('speedSel').addEventListener('change', e => { S.speed = +e.target.value; if (S.src === 'video') video.playbackRate = S.speed; });
const wrap = $('stageWrap');
wrap.addEventListener('dragover', e => { e.preventDefault(); $('drop').hidden = false; });
wrap.addEventListener('dragleave', e => { if (!wrap.contains(e.relatedTarget)) $('drop').hidden = true; });
wrap.addEventListener('drop', e => { e.preventDefault(); $('drop').hidden = true; loadFile(e.dataTransfer.files[0]); });
document.addEventListener('keydown', e => {
  const k = e.key;
  if (!$('exModal').hidden) { if (k === 'Escape' && !$('exSetup').hidden) closeExport(); return; }
  if (e.target.closest('input,select,textarea')) return;
  if (S.exporting) { if (k.toLowerCase() === 'c') toggleCoach(); return; }
  if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey || S.tracking) return;
  if (k === ' ') { e.preventDefault(); togglePlay(); }
  else if (k === 'ArrowLeft') { e.preventDefault(); e.shiftKey ? (pause(), setTime(S.t - 1)) : stepFrames(-1); }
  else if (k === 'ArrowRight') { e.preventDefault(); e.shiftKey ? (pause(), setTime(S.t + 1)) : stepFrames(1); }
  else if (k === 'Enter') finishDraft();
  else if (k === 'Escape') { if (S.draft) S.draft = null; else select(null); }
  else if ((k === 'Delete' || k === 'Backspace') && S.sel) { e.preventDefault(); removeG(S.sel, true); }
  else if (k.toLowerCase() === 'c') toggleCoach();
  else { const t = TOOLS.find(x => x[2] === k.toUpperCase()); if (t && !S.coach) setTool(t[0]); }
});

syncPlay(); setTool('select');
loadDemo();
requestAnimationFrame(tick);
})();
</script>
